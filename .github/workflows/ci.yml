name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --locked --python ${{ matrix.python-version }} ruff check .
      - name: Check formatting
        run: uv run --locked --python ${{ matrix.python-version }} ruff format --check .
      - name: Test
        run: uv run --locked --python ${{ matrix.python-version }} pytest
      - name: Build distribution
        run: uv build --python ${{ matrix.python-version }}
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          uv venv .wheel-smoke --python ${{ matrix.python-version }}
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/clickup-mcp --help
          .wheel-smoke/bin/clickup-mcp --version
